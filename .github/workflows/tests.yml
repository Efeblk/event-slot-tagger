name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      # CPU part only; the GPU build of torch in requirements-lock.txt does not install on CI.
      # The CRF-layer test needs torch and is skipped here.
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -v
